name: Validate PR - Trusted Artifact variants
'on':
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  go:
    name: Check Trusted Artifact variants
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq
        uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
        with:
          # Version from https://github.com/mikefarah/yq/releases
          version: 'v4.53.3'

      - name: Check Trusted Artifact variants
        id: check
        run: |
          hack/generate-ta-tasks.sh

      - name: Check missing Trusted Artifact variants
        id: missing
        run: |
          hack/missing-ta-tasks.sh

      - name: Attach patch
        if: ${{ steps.check.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Trusted artifacts patch
          path: ./ta.patch
