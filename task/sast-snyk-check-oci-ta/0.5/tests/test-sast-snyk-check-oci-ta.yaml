---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-sast-snyk-check-oci-ta
spec:
  description: |
    Test for sast-snyk-check-oci-ta. FETCH_EXTRA_ARTIFACTS is false, so
    fetch-extra-artifacts exits without fetching. The Snyk scan still runs
    against the trusted source artifact created by this test.
  workspaces:
    - name: tests-workspace
  tasks:
    - name: init
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:4be9343579d91c7b501cafe966cff59a601dfeca903c476e3763dd8d7599b900
          - name: kind
            value: task
      params:
        - name: image-url
          value: "quay.io/redhat-user-workloads/sast-tests-tenant/tests/tests-sast-shell-check:latest"
    - name: mock-inputs
      runAfter:
        - init
      params:
        - name: ociStorage
          value: registry-service.kind-registry/sast-snyk-check-oci-ta-test:git
      taskSpec:
        results:
          - name: SOURCE_ARTIFACT
            type: string
        params:
          - name: ociStorage
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - name: workdir
              mountPath: /work
        steps:
          - name: create-test-source
            image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:15c5eeb451924ddfc9d8680319130fe277df7850728d5c37f13ae3eb9d607249
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              mkdir -p /work/source
              # Snyk Code reports command injection as an important finding.
              printf '%s\n' \
                'import os' \
                'from flask import Flask, request' \
                '' \
                'app = Flask(__name__)' \
                '' \
                '@app.route("/run")' \
                'def run():' \
                '    os.system(request.args.get("cmd"))' \
                > /work/source/run.py
          - name: create-trusted-artifact
            image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:15c5eeb451924ddfc9d8680319130fe277df7850728d5c37f13ae3eb9d607249
            env:
              - name: ORAS_OPTIONS
                value: --insecure
            args:
              - create
              - --store
              - $(params.ociStorage)
              - $(results.SOURCE_ARTIFACT.path)=/work/source
    - name: scan-with-snyk
      runAfter:
        - mock-inputs
      taskRef:
        name: sast-snyk-check-oci-ta
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.mock-inputs.results.SOURCE_ARTIFACT)
        - name: FETCH_EXTRA_ARTIFACTS
          value: "false"
        - name: image-url
          # TODO add credentials for `oci-attach` so that upload can be tested
          # for now, set this to empty string to force skipping of upload results step
          value: ""
        - name: image-digest
          value: sha256:a6e305864fefbce727a3d8cc9f0277eede5f0617696f9cda486b1f6b3b94f7cb
    - name: check-result
      runAfter:
        - scan-with-snyk
      params:
        - name: results
          value: $(tasks.scan-with-snyk.results.TEST_OUTPUT)
      taskSpec:
        params:
          - name: results
        steps:
          - name: check-result
            image: quay.io/konflux-ci/konflux-test:v1.5.8@sha256:ce93e7ff1618deda40a66d90289d8fee1bf1ac151c06f1defd33d2a56dbd2b94
            env:
            - name: RESULTS
              value: $(params.results)
            script: |
              #!/bin/bash

              set -e

              echo "$RESULTS"
              echo -n "Expected FAILURE from source run.py: "
              echo "$RESULTS" | jq -e '.result == "FAILURE" and .failures >= 1'
