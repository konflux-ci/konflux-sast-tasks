---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-sast-shell-check-kfp-explicit-url
spec:
  description: |
    Pass the former hardcoded GitLab KFP URL as KFP_GIT_URL. cluster-config is
    seeded with a different cloneable repo; this test checks the param wins.
  workspaces:
    - name: tests-workspace
  tasks:
    - name: init
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:7854d7babe4136e53e337f6433d952532314433b48bb62b422ddc02700934d85
          - name: kind
            value: task
      params:
        - name: image-url
          value: "quay.io/redhat-user-workloads/sast-tests-tenant/tests/tests-sast-shell-check:latest"
    - name: clone-repository
      runAfter:
        - init
      workspaces:
        - name: output
          workspace: tests-workspace
      params:
        - name: url
          value: https://github.com/konflux-ci/test-data-sast
        - name: revision
          value: main
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/container-build-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/git-clone/git-clone.yaml
    - name: scan-with-shellcheck
      workspaces:
        - name: workspace
          workspace: tests-workspace
      runAfter:
        - clone-repository
      taskRef:
        name: sast-shell-check
      params:
        - name: image-url
          value: "quay.io/redhat-user-workloads/sast-tests-tenant/tests/tests-sast-shell-check:latest"
        - name: KFP_GIT_URL
          value: https://gitlab.cee.redhat.com/osh/known-false-positives.git
    - name: check-result
      runAfter:
        - scan-with-shellcheck
      workspaces:
        - name: workspace
          workspace: tests-workspace
      params:
        - name: test-output
          value: $(tasks.scan-with-shellcheck.results.TEST_OUTPUT)
      taskSpec:
        params:
          - name: test-output
        workspaces:
          - name: workspace
        steps:
          - name: check-explicit-kfp-url-used
            image: quay.io/konflux-ci/konflux-test:v1.5.8@sha256:ce93e7ff1618deda40a66d90289d8fee1bf1ac151c06f1defd33d2a56dbd2b94
            script: |
              #!/usr/bin/env bash
              set -eu
              KFP_DIR="$(workspaces.workspace.path)/hacbs/sast-shell-check/known-false-positives"
              expected="https://gitlab.cee.redhat.com/osh/known-false-positives.git"
              cluster_url="https://github.com/octocat/Hello-World.git"

              if [[ -d "${KFP_DIR}/.git" ]]; then
                origin=$(git -C "${KFP_DIR}" remote get-url origin)
                if [[ "${origin}" != "${expected}" ]]; then
                  echo "FAIL: explicit KFP_GIT_URL was not used, origin is ${origin}"
                  exit 1
                fi
                echo "PASS: cloned explicit KFP_GIT_URL ${origin}"
              else
                echo "PASS: ${expected} was used; cluster-config ${cluster_url} was not cloned"
              fi
          - name: check-test-output
            image: quay.io/konflux-ci/konflux-test:v1.5.8@sha256:ce93e7ff1618deda40a66d90289d8fee1bf1ac151c06f1defd33d2a56dbd2b94
            env:
              - name: TEST_OUTPUT
                value: $(params.test-output)
            script: |
              #!/usr/bin/env bash
              set -eu

              echo "Verifying TEST_OUTPUT result..."
              echo "TEST_OUTPUT: $TEST_OUTPUT"

              if ! echo "$TEST_OUTPUT" | jq -e '.result == "FAILURE"' > /dev/null; then
                echo "FAIL: Expected TEST_OUTPUT.result to be FAILURE when findings are present"
                echo "$TEST_OUTPUT" | jq '.'
                exit 1
              fi

              failures=$(echo "$TEST_OUTPUT" | jq -r '.failures')
              if [[ "$failures" != "10" ]]; then
                echo "FAIL: Expected 10 failures, got $failures"
                echo "$TEST_OUTPUT" | jq '.'
                exit 1
              fi

              echo "PASS: TEST_OUTPUT shows FAILURE with 10 findings for explicit GitLab KFP URL"
          - name: check-result
            image: quay.io/konflux-ci/konflux-test:v1.5.8@sha256:ce93e7ff1618deda40a66d90289d8fee1bf1ac151c06f1defd33d2a56dbd2b94
            script: |
              #!/usr/bin/env bash
              set -eu
              echo "Check-result"
              output=$(csgrep --mode=evtstat "$(workspaces.workspace.path)"/hacbs/sast-shell-check/shellcheck-results.sarif | tr -d '\n')
              expected="      8	SHELLCHECK_WARNING                              	warning[SC1083]      2	SHELLCHECK_WARNING                              	warning[SC2069]"
              if [[ "$output" == "$expected" ]]; then
                echo "Test passed!"
              else
                echo "Test failed!"
                echo "Actual output: [$output]"
                echo "Expected output: [$expected]"
                return 1
              fi
