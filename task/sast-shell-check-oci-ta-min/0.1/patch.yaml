- op: replace
  path: /metadata/name
  value: sast-shell-check-oci-ta-min
# kustomize build task/sast-shell-check-oci-ta/0.1 | yq '.spec.steps.[].name' | nl -v 0 
#     0	use-trusted-artifact
#     1	sast-shell-check
#     2	upload

# use-trusted-artifact step — keep minimal (not the production 4Gi TA standard)
- op: test
  path: /spec/steps/0/name
  value: use-trusted-artifact
- op: replace
  path: /spec/steps/0/computeResources
  value:
    limits:
      memory: 64Mi
    requests:
      memory: 64Mi
      cpu: 50m

# sast-shell-check step — reduced for minimal/demo pipelines (PR #93);
# parent oci-ta has no limits.cpu (policy); only shrink memory + cpu request
- op: test
  path: /spec/steps/1/name
  value: sast-shell-check
- op: replace
  path: /spec/steps/1/computeResources
  value:
    limits:
      memory: 256Mi
    requests:
      memory: 256Mi
      cpu: 128m
