---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sast-unicode-check-oci-ta
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: konflux
  labels:
    app.kubernetes.io/version: 0.4.2
spec:
  description: Scans source code for non-printable unicode characters in all
    text files.
  params:
    - name: EXTRA_ARTIFACT_FILTER
      description: Extended regex matching org.opencontainers.image.title
        and olot.layer.content.inlayerpath when present and FETCH_EXTRA_ARTIFACTS=true.
      type: string
      default: (^|/)(Dockerfile|Containerfile|[^/]+[.](json|yaml|yml|toml|jinja|jinja2|sh|bash|zsh|ksh|py))$
    - name: FETCH_EXTRA_ARTIFACTS
      description: When "true", fetch files matching EXTRA_ARTIFACT_FILTER
        from image-url@image-digest into /var/workdir/source alongside the
        restored SOURCE_ARTIFACT. Supports raw OCI artifacts and titled layers
        in container images such as ModelCar.
      type: string
      default: "false"
    - name: FIND_UNICODE_CONTROL_ARGS
      description: arguments for find-unicode-control command.
      type: string
      default: -p bidi -v -d -t
    - name: KFP_GIT_URL
      description: Known False Positives (KFP) git URL (optionally taking
        a revision delimited by \#). Defaults to "SITE_DEFAULT", which means
        the default value "https://gitlab.cee.redhat.com/osh/known-false-positives.git"
        for internal Konflux instance and empty string for external Konflux
        instance. If set to an empty string, the KFP filtering is disabled.
      type: string
      default: SITE_DEFAULT
    - name: PROJECT_NAME
      description: Name of the scanned project, used to find path exclusions.
        By default, the Konflux component name will be used.
      type: string
      default: ""
    - name: RECORD_EXCLUDED
      description: |
        Whether to record the excluded findings (defaults to false).
        If `true`, the excluded findings will be stored in `excluded-findings.json`.
      type: string
      default: "false"
    - name: SOURCE_ARTIFACT
      description: The Trusted Artifact URI pointing to the artifact with
        the application source code.
      type: string
    - name: TARGET_DIRS
      description: Target directories in component's source code. Multiple
        values should be separated with commas.
      type: string
      default: .
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the
        CA bundle data.
      type: string
      default: ca-bundle.crt
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca
    - name: image-digest
      description: Image digest used for ORAS upload.
      type: string
    - name: image-url
      description: Image URL used for ORAS upload.
      type: string
  results:
    - name: TEST_OUTPUT
      description: Tekton task test output.
  volumes:
    - name: trusted-ca
      configMap:
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        name: $(params.caTrustConfigMapName)
        optional: true
    - name: workdir
      emptyDir: {}
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
  steps:
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:d4155ab6553b406bd5ab96b98bb10ab97a38a6f9dcb7c39dd18678428e8b2e64
      args:
        - use
        - $(params.SOURCE_ARTIFACT)=/var/workdir/source
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      computeResources:
        limits:
          memory: 4Gi
        requests:
          cpu: 50m
          memory: 4Gi
    - name: fetch-extra-artifacts
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:d4155ab6553b406bd5ab96b98bb10ab97a38a6f9dcb7c39dd18678428e8b2e64
      workingDir: /var/workdir
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      env:
        - name: FETCH_EXTRA_ARTIFACTS
          value: $(params.FETCH_EXTRA_ARTIFACTS)
        - name: EXTRA_ARTIFACT_FILTER
          value: $(params.EXTRA_ARTIFACT_FILTER)
        - name: IMAGE_URL
          value: $(params.image-url)
        - name: IMAGE_DIGEST
          value: $(params.image-digest)
        - name: CA_FILE
          value: /etc/pki/tls/certs/ca-custom-bundle.crt
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [[ "${FETCH_EXTRA_ARTIFACTS}" != "true" ]]; then
          exit 0
        fi

        if [[ -z "${IMAGE_URL}" || -z "${IMAGE_DIGEST}" ]]; then
          echo "INFO: image-url/image-digest missing, cannot fetch extra artifacts"
          exit 0
        fi

        filter_status=0
        grep -E -e "${EXTRA_ARTIFACT_FILTER}" </dev/null || filter_status=$?
        if [[ "${filter_status}" -ne 1 ]]; then
          echo "ERROR: Could not validate EXTRA_ARTIFACT_FILTER" >&2
          exit 1
        fi

        SOURCE_ROOT="/var/workdir/source"
        MANIFEST_FILE="/tmp/manifest.json"

        declare -a oras_opts=()
        # shellcheck source=/dev/null
        source /usr/local/bin/oras_opts.sh

        IMAGE_REF="${IMAGE_URL}@${IMAGE_DIGEST}"
        echo "INFO: Fetching extra artifacts from OCI reference ${IMAGE_REF}"

        authfile="$(mktemp)"
        cleanup_paths=("${authfile}")
        cleanup() {
          rm -rf "${cleanup_paths[@]}"
        }
        trap cleanup EXIT
        /usr/local/bin/select-oci-auth.sh "${IMAGE_URL}" >"${authfile}"

        # shellcheck disable=SC2086 # empty-array expansion under set -u
        retry oras manifest fetch ${oras_opts[@]+"${oras_opts[@]}"} --registry-config "${authfile}" "${IMAGE_REF}" >"${MANIFEST_FILE}"

        # Multi-arch index (e.g. modelcar build-image-index) → one platform manifest.
        media_type="$(jq -r '.mediaType // ""' "${MANIFEST_FILE}")"
        if [[ "${media_type}" == "application/vnd.oci.image.index.v1+json" ]] ||
          [[ "${media_type}" == "application/vnd.docker.distribution.manifest.list.v2+json" ]]; then
          child_digest="$(jq -r '
            (.manifests // []) as $m
            | ($m | map(select(.platform.architecture == "amd64" and ((.platform.os // "linux") == "linux"))) | .[0].digest)
              // ($m | map(select((.platform.os // "linux") == "linux")) | .[0].digest)
              // ($m[0].digest)
              // empty
          ' "${MANIFEST_FILE}")"
          if [[ -z "${child_digest}" || "${child_digest}" == "null" ]]; then
            echo "ERROR: image index has no manifests to resolve"
            exit 1
          fi
          echo "INFO: Resolving image index to ${child_digest}"
          # shellcheck disable=SC2086 # empty-array expansion under set -u
          retry oras manifest fetch ${oras_opts[@]+"${oras_opts[@]}"} --registry-config "${authfile}" "${IMAGE_URL}@${child_digest}" >"${MANIFEST_FILE}"
        fi

        config_media_type="$(jq -r '.config.mediaType // ""' "${MANIFEST_FILE}")"
        is_container_image=false
        if [[ "${config_media_type}" == "application/vnd.oci.image.config.v1+json" ]] ||
          [[ "${config_media_type}" == "application/vnd.docker.container.image.v1+json" ]]; then
          is_container_image=true
          echo "INFO: Reference is a container image (${config_media_type}); extracting titled layers matching EXTRA_ARTIFACT_FILTER"
        fi

        mkdir -p "${SOURCE_ROOT}"
        fetched_count=0

        path_allowed() {
          local rel_path="$1"
          local resolved_dest
          resolved_dest="$(realpath -m "${SOURCE_ROOT}/${rel_path}")"
          if [[ ! "${resolved_dest}" == "${SOURCE_ROOT}"/* ]]; then
            echo "WARN: Skipping path outside source root: ${rel_path}" >&2
            return 1
          fi
          if [[ -e "${resolved_dest}" || -L "${SOURCE_ROOT}/${rel_path}" ]]; then
            echo "WARN: Keeping existing source path: ${rel_path}" >&2
            return 1
          fi
          printf '%s\n' "${resolved_dest}"
        }

        if [[ "${is_container_image}" == "true" ]]; then
          # ModelCar/olot (and similar) store one file per titled tar layer. Fetch only
          # matching layers — skip base-image layers (no title) and huge weight blobs.
          layers="$(jq -r '
            .layers[]
            | select((.annotations["org.opencontainers.image.title"] // "") != "")
            | [
                .digest,
                (.mediaType // "unknown"),
                (.annotations["org.opencontainers.image.title"] // ""),
                (.annotations["olot.layer.content.inlayerpath"] // "")
              ]
            | @tsv
          ' "${MANIFEST_FILE}")"
          while IFS=$'\t' read -r digest media_type title inlayer_path; do
            [[ -n "${title}" ]] || continue
            match_path="${inlayer_path:-${title}}"
            match_path="${match_path#/}"
            if ! printf '%s\n' "${match_path}" | grep -E -e "${EXTRA_ARTIFACT_FILTER}" >/dev/null &&
              ! printf '%s\n' "${title}" | grep -E -e "${EXTRA_ARTIFACT_FILTER}" >/dev/null; then
              continue
            fi

            tmp_blob="$(mktemp)"
            tmp_dir="$(mktemp -d)"
            cleanup_paths+=("${tmp_blob}" "${tmp_dir}")
            echo "INFO: Fetching layer ${digest} (${title}) for extraction"
            # shellcheck disable=SC2086 # empty-array expansion under set -u
            retry oras blob fetch ${oras_opts[@]+"${oras_opts[@]}"} --registry-config "${authfile}" "${IMAGE_URL}@${digest}" --output "${tmp_blob}"

            # olot model files are uncompressed tar; modelcard layers are tar+gzip.
            if [[ "${media_type}" == *gzip* ]] || [[ "${media_type}" == *tar+gzip* ]]; then
              tar --no-same-owner --no-same-permissions -xzf "${tmp_blob}" -C "${tmp_dir}"
            else
              tar --no-same-owner --no-same-permissions -xf "${tmp_blob}" -C "${tmp_dir}"
            fi

            while IFS= read -r -d '' extracted; do
              rel_path="${extracted#"${tmp_dir}"/}"
              rel_path="${rel_path#./}"
              [[ -n "${rel_path}" ]] || continue
              if ! dest_path="$(path_allowed "${rel_path}")"; then
                continue
              fi
              mkdir -p "$(dirname "${dest_path}")"
              cp -a "${extracted}" "${dest_path}"
              echo "INFO: Extracted ${rel_path}"
              fetched_count=$((fetched_count + 1))
            done < <(find "${tmp_dir}" -type f -print0)

            rm -rf "${tmp_blob}" "${tmp_dir}"
          done <<<"${layers}"
        else
          layers="$(jq -r '.layers[] | [.digest, (.annotations["org.opencontainers.image.title"] // "")] | @tsv' "${MANIFEST_FILE}")"
          while IFS=$'\t' read -r digest rel_path; do
            [[ -n "${rel_path}" ]] || continue
            if ! printf '%s\n' "${rel_path}" | grep -E -e "${EXTRA_ARTIFACT_FILTER}" >/dev/null; then
              continue
            fi

            if ! dest_path="$(path_allowed "${rel_path}")"; then
              continue
            fi

            mkdir -p "$(dirname "${dest_path}")"
            echo "INFO: Fetching blob ${digest} -> ${rel_path}"
            # shellcheck disable=SC2086 # empty-array expansion under set -u
            retry oras blob fetch ${oras_opts[@]+"${oras_opts[@]}"} --registry-config "${authfile}" "${IMAGE_URL}@${digest}" --output "${dest_path}"
            fetched_count=$((fetched_count + 1))
          done <<<"${layers}"
        fi

        if [[ "${fetched_count}" -eq 0 ]]; then
          echo "INFO: No files matched EXTRA_ARTIFACT_FILTER"
        else
          echo "INFO: Fetched ${fetched_count} extra artifact file(s) alongside SOURCE_ARTIFACT"
        fi
      computeResources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 512Mi
    - name: sast-unicode-check
      image: quay.io/konflux-ci/konflux-test:v1.5.8@sha256:ce93e7ff1618deda40a66d90289d8fee1bf1ac151c06f1defd33d2a56dbd2b94
      workingDir: /var/workdir/source
      volumeMounts:
        - mountPath: /mnt/trusted-ca
          name: trusted-ca
          readOnly: true
      env:
        - name: KFP_GIT_URL
          value: $(params.KFP_GIT_URL)
        - name: PROJECT_NAME
          value: $(params.PROJECT_NAME)
        - name: FIND_UNICODE_CONTROL_ARGS
          value: $(params.FIND_UNICODE_CONTROL_ARGS)
        - name: RECORD_EXCLUDED
          value: $(params.RECORD_EXCLUDED)
        - name: TARGET_DIRS
          value: $(params.TARGET_DIRS)
        - name: SOURCE_CODE_DIR
          value: /var/workdir
        - name: COMPONENT_LABEL
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['appstudio.openshift.io/component']
        - name: BUILD_PLR_LOG_URL
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipelinesascode.tekton.dev/log-url']
      script: |
        #!/usr/bin/env bash
        set -exuo pipefail

        # shellcheck source=/dev/null
        . /utils.sh
        trap 'handle_error $(results.TEST_OUTPUT.path)' EXIT

        if [[ -z "${PROJECT_NAME}" ]]; then
          PROJECT_NAME=${COMPONENT_LABEL}
        fi

        echo "INFO: The PROJECT_NAME used is: ${PROJECT_NAME}"

        ca_bundle=/mnt/trusted-ca/ca-bundle.crt
        if [ -f "$ca_bundle" ]; then
          echo "INFO: Using mounted CA bundle: $ca_bundle"
          cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors
          update-ca-trust
        fi

        SCAN_PROP="https://github.com/siddhesh/find-unicode-control.git#c2accbfbba7553a8bc1ebd97089ae08ad8347e58"
        FUC_EXIT_CODE=0

        # generate full path for each dirname separated by comma
        declare -a ALL_TARGETS
        OLD_IFS="$IFS"
        IFS=","
        for d in $TARGET_DIRS; do
          ALL_TARGETS+=("${SOURCE_CODE_DIR}/source/${d}")
        done
        IFS="$OLD_IFS"

        # shellcheck disable=SC2086
        LANG=en_US.utf8 find_unicode_control.py ${FIND_UNICODE_CONTROL_ARGS} "${ALL_TARGETS[@]}" \
          >raw_sast_unicode_check_out.txt \
          2>raw_sast_unicode_check_out.log ||
          FUC_EXIT_CODE=$?
        if [[ "${FUC_EXIT_CODE}" -ne 0 ]] && [[ "${FUC_EXIT_CODE}" -ne 1 ]]; then
          echo "Failed to run find-unicode-control command" >&2
          cat raw_sast_unicode_check_out.log
          note="Task $(context.task.name) failed: For details, check Tekton task log."
          ERROR_OUTPUT=$(make_result_json -r ERROR -t "$note")
          echo "${ERROR_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
          exit 1
        fi

        # Translate the output format
        if ! sed -i raw_sast_unicode_check_out.txt -E -e 's|(.*:[0-9]+)(.*)|\1: warning:\2|' -e 's|^|Error: UNICONTROL_WARNING:\n|'; then
          echo "Error: failed to translate the unicontrol output format" >&2
          note="Task $(context.task.name) failed: For details, check Tekton task log."
          ERROR_OUTPUT=$(make_result_json -r ERROR -t "$note")
          echo "${ERROR_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
          exit 1
        fi

        # Process all results as configured with CSGERP_OPTS
        CSGERP_OPTS=(
          --mode=json
          --remove-duplicates
          --embed-context=3
          --set-scan-prop="${SCAN_PROP}"
          --strip-path-prefix="${SOURCE_CODE_DIR}"/source/
        )
        # In order to generate csdiff/v1, we need to add the whole path of the source code as
        # sast-unicode-check only provides an URI to embed the context
        if ! csgrep "${CSGERP_OPTS[@]}" raw_sast_unicode_check_out.txt >processed_sast_unicode_check_out.json 2>processed_sast_unicode_check_out.err; then
          echo "Error occurred while running csgrep with CSGERP_OPTS:"
          cat processed_sast_unicode_check_out.err
          note="Task $(context.task.name) failed: For details, check Tekton task log."
          ERROR_OUTPUT=$(make_result_json -r ERROR -t "$note")
          echo "${ERROR_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
          exit 1
        fi

        csgrep --mode=evtstat processed_sast_unicode_check_out.json
        csgrep processed_sast_unicode_check_out.json

        if [[ "${KFP_GIT_URL}" == "SITE_DEFAULT" ]]; then
          KFP_GIT_URL="https://gitlab.cee.redhat.com/osh/known-false-positives.git"
        fi
        PROBE_URL="${KFP_GIT_URL%.git}" # trims '.git' suffix

        # create the KFP clone directory regardless
        KFP_DIR="known-false-positives"
        KFP_CLONED="0"
        mkdir "${KFP_DIR}"

        # We check if the KFP_GIT_URL variable is set to clone and apply the filters or not
        if [[ -n "${KFP_GIT_URL}" ]]; then
          # Default location only reachable from internal Konflux instances, check reachable first
          echo -n "INFO: Probing ${PROBE_URL}... "
          if curl --fail --head --max-time 60 --no-progress-meter "${PROBE_URL}" > >(head -1); then
            echo "INFO: Trying to clone known-false-positives.."
            git clone "${KFP_GIT_URL}" "${KFP_DIR}" && KFP_CLONED="1"
          fi
        fi

        # If KFP clone failed, use the unfiltered results
        if [[ "${KFP_CLONED}" -eq "0" ]]; then
          echo "WARN: Failed to clone known-false-positives at ${KFP_GIT_URL}, scan results will not be filtered"
          mv processed_sast_unicode_check_out.json sast_unicode_check_out.json
        else
          echo "INFO: Filtering false positives in results files using csfilter-kfp..."

          # Build initial csfilter-kfp command
          csfilter_kfp_cmd=(
            csfilter-kfp
            --verbose
            --kfp-dir="${KFP_DIR}"
            --project-nvr="${PROJECT_NAME}"
          )

          # Append --record-excluded option if RECORD_EXCLUDED is true
          if [[ "${RECORD_EXCLUDED}" == "true" ]]; then
            csfilter_kfp_cmd+=(--record-excluded="excluded-findings.json")
          fi

          # Execute the command and capture any errors
          set +e
          "${csfilter_kfp_cmd[@]}" processed_sast_unicode_check_out.json >sast_unicode_check_out.json 2>sast_unicode_check_out.error
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "WARN: failed to filter known false positives" >&2
            mv processed_sast_unicode_check_out.json sast_unicode_check_out.json
          else
            echo "INFO: Succeeded filtering known false positives" >&2
          fi
        fi

        # Generate sarif report
        csgrep --mode=sarif sast_unicode_check_out.json >sast_unicode_check_out.sarif
        if [[ "${FUC_EXIT_CODE}" -eq 0 ]]; then
          note="Task $(context.task.name) success: No finding was detected"
          ERROR_OUTPUT=$(make_result_json -r SUCCESS -t "$note")
        elif [[ "${FUC_EXIT_CODE}" -eq 1 ]] && [[ ! -s sast_unicode_check_out.sarif ]]; then
          note="Task $(context.task.name) success: Some findings were detected, but filtered by known false positive"
          ERROR_OUTPUT=$(make_result_json -r SUCCESS -t "$note")
        else
          echo "sast-unicode-check test failed because of the following issues:"
          cat sast_unicode_check_out.json
          TEST_OUTPUT=
          parse_test_output "$(context.task.name)" sarif sast_unicode_check_out.sarif || true
          note="Task $(context.task.name) failed: For details, check Tekton task log."
          ERROR_OUTPUT=$(make_result_json -r ERROR -t "$note")
        fi
        echo "${TEST_OUTPUT:-${ERROR_OUTPUT}}" | tee "$(results.TEST_OUTPUT.path)"
      computeResources:
        limits:
          memory: 256Mi
        requests:
          cpu: 600m
          memory: 256Mi
    - name: upload
      image: quay.io/konflux-ci/oras:latest@sha256:1cc659b4d30536ec98300ac551739ef36dee345a7dcfe06129fd78abdc3688ac
      workingDir: /var/workdir/source
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      env:
        - name: IMAGE_URL
          value: $(params.image-url)
        - name: IMAGE_DIGEST
          value: $(params.image-digest)
      script: |
        #!/usr/bin/env bash

        if [ -z "${IMAGE_URL}" ]; then
          echo 'No image-url param provided. Skipping upload.'
          exit 0
        fi

        UPLOAD_FILES="sast_unicode_check_out.sarif excluded-findings.json"
        for UPLOAD_FILE in ${UPLOAD_FILES}; do
          if [ ! -f "${UPLOAD_FILE}" ]; then
            echo "No ${UPLOAD_FILE} exists. Skipping upload."
            continue
          fi

          if [ "${UPLOAD_FILE}" == "excluded-findings.json" ]; then
            MEDIA_TYPE=application/json
          else
            MEDIA_TYPE=application/sarif+json
          fi

          echo "Selecting auth"
          select-oci-auth "${IMAGE_URL}" >"${HOME}/auth.json"
          echo "Attaching to ${IMAGE_URL}"
          retry oras attach --no-tty --registry-config "$HOME/auth.json" --artifact-type "${MEDIA_TYPE}" "${IMAGE_URL}@${IMAGE_DIGEST}" "${UPLOAD_FILE}:${MEDIA_TYPE}"
        done
      computeResources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 256Mi
