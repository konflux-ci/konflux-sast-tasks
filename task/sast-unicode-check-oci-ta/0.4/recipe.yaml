---
base: ../../sast-unicode-check/0.4/sast-unicode-check.yaml
add:
  - use-source
preferStepTemplate: true
removeWorkspaces:
  - workspace
replacements:
  workspaces.workspace.path: /var/workdir
regexReplacements:
  hacbs/\$\(context.task.name\): source
useTAVolumeMount: true
addParams:
  - name: FETCH_EXTRA_ARTIFACTS
    type: string
    description: When "true", fetch files matching EXTRA_ARTIFACT_FILTER from image-url@image-digest (OCI artifact manifest) into /var/workdir/source alongside the restored SOURCE_ARTIFACT. Skipped for standard container images.
    default: "false"
  - name: EXTRA_ARTIFACT_FILTER
    type: string
    description: Extended regex matching org.opencontainers.image.title paths in the OCI manifest when FETCH_EXTRA_ARTIFACTS=true.
    default: '(^|/)(Dockerfile|Containerfile|[^/]+[.](json|yaml|yml|toml|jinja|jinja2|sh|bash|zsh|ksh|py))$'
additionalSteps:
  - at: 1
    name: fetch-extra-artifacts
    # Image used by the Snyk 0.4 artifact fetch step.
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:a246cf2267fe6fa68ae8885c6ca4141923edca3ccf9b56838d1ebe369d31b46d
    workingDir: /var/workdir
    volumeMounts:
      - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
        name: trusted-ca
        readOnly: true
        subPath: ca-bundle.crt
    env:
      - name: FETCH_EXTRA_ARTIFACTS
        value: $(params.FETCH_EXTRA_ARTIFACTS)
      - name: EXTRA_ARTIFACT_FILTER
        value: $(params.EXTRA_ARTIFACT_FILTER)
      - name: IMAGE_URL
        value: $(params.image-url)
      - name: IMAGE_DIGEST
        value: $(params.image-digest)
      - name: CA_FILE
        value: /etc/pki/tls/certs/ca-custom-bundle.crt
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      if [[ "${FETCH_EXTRA_ARTIFACTS}" != "true" ]]; then
        exit 0
      fi

      if [[ -z "${IMAGE_URL}" || -z "${IMAGE_DIGEST}" ]]; then
        echo "INFO: image-url/image-digest missing, cannot fetch extra artifacts"
        exit 0
      fi

      filter_status=0
      grep -E -e "${EXTRA_ARTIFACT_FILTER}" </dev/null || filter_status=$?
      if [[ "${filter_status}" -ne 1 ]]; then
        echo "ERROR: Could not validate EXTRA_ARTIFACT_FILTER" >&2
        exit 1
      fi

      declare -a oras_opts=()
      # shellcheck source=/dev/null
      source /usr/local/bin/oras_opts.sh

      IMAGE_REF="${IMAGE_URL}@${IMAGE_DIGEST}"
      echo "INFO: Fetching extra artifacts from OCI reference ${IMAGE_REF}"

      authfile="$(mktemp)"
      trap 'rm -f "${authfile}"' EXIT
      /usr/local/bin/select-oci-auth.sh "${IMAGE_URL}" >"${authfile}"

      retry oras manifest fetch "${oras_opts[@]}" --registry-config "${authfile}" "${IMAGE_REF}" >"/tmp/manifest.json"

      manifest_media_type="$(jq -r '.mediaType // ""' /tmp/manifest.json)"
      case "${manifest_media_type}" in
        application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json)
          echo "INFO: Reference points to an image index; skipping extra artifact fetch"
          exit 0
          ;;
      esac

      config_media_type="$(jq -r '.config.mediaType // ""' /tmp/manifest.json)"
      if [[ "${config_media_type}" == "application/vnd.oci.image.config.v1+json" ]] || [[ "${config_media_type}" == "application/vnd.docker.container.image.v1+json" ]]; then
        echo "INFO: Reference points to a container image config (${config_media_type}); skipping extra artifact fetch"
        exit 0
      fi

      mkdir -p /var/workdir/source

      layers="$(jq -r '.layers[] | [.digest, (.annotations["org.opencontainers.image.title"] // "")] | @tsv' /tmp/manifest.json)"
      fetched_count=0
      while IFS=$'\t' read -r digest rel_path; do
        [[ -n "${rel_path}" ]] || continue
        if ! printf '%s\n' "${rel_path}" | grep -E -e "${EXTRA_ARTIFACT_FILTER}" >/dev/null; then
          continue
        fi

        dest_path="/var/workdir/source/${rel_path}"
        resolved_dest="$(realpath -m "${dest_path}")"
        if [[ ! "${resolved_dest}" == /var/workdir/source/* ]]; then
          echo "WARN: Skipping path outside source root: ${rel_path}"
          continue
        fi

        if [[ -e "${resolved_dest}" || -L "${dest_path}" ]]; then
          echo "WARN: Keeping existing source path: ${rel_path}"
          continue
        fi

        mkdir -p "$(dirname "${resolved_dest}")"
        echo "INFO: Fetching blob ${digest} -> ${rel_path}"
        retry oras blob fetch "${oras_opts[@]}" --registry-config "${authfile}" "${IMAGE_URL}@${digest}" --output "${resolved_dest}"
        fetched_count=$((fetched_count + 1))
      done <<<"${layers}"

      if [[ "${fetched_count}" -eq 0 ]]; then
        echo "INFO: No files matched EXTRA_ARTIFACT_FILTER"
      else
        echo "INFO: Fetched ${fetched_count} extra artifact file(s) alongside SOURCE_ARTIFACT"
      fi
    computeResources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi
